services:
  backend:
    container_name: assetmanagement-backend
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      PORT: ${PORT:-5000}
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-assetmanagement_db};Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD:-Admin12345;}
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: assetmanagement-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assetmanagement_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Admin12345;}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../INSTRUCTION/database-schema.md:/docker-entrypoint-initdb.d/database-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-assetmanagement_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data: